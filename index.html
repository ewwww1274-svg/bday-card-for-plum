<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Plum 🎂</title>
<style>
  :root{
    --lavender: #cbb9e8;
    --lavender-deep: #9b7fc7;
    --pink: #ffd1e3;
    --pink-deep: #ff9ec7;
    --cream: #fff7fb;
    --star-yellow: #ffe066;
    --text: #5b4b6a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body {
    background: linear-gradient(160deg, var(--lavender) 0%, var(--pink) 100%);
    position: relative;
  }

  .page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease, transform 1s ease;
  }

  /* ---------- PAGE 1: CANDLE ---------- */

  #page-candle.hidden {
    opacity: 0;
    transform: scale(1.08);
    pointer-events: none;
  }

  .title-cute {
    font-family: 'Brush Script MT', cursive;
    font-size: 2.1rem;
    color: var(--lavender-deep);
    text-shadow: 0 2px 8px rgba(255,255,255,0.6);
    margin-bottom: 6px;
    text-align: center;
    padding: 0 20px;
  }

  .subtitle-cute {
    font-size: 0.95rem;
    color: var(--text);
    opacity: 0.75;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    font-size: 1.4rem;
    animation: dance 2.4s ease-in-out infinite, twinkle 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,224,102,0.8));
  }

  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    25% { transform: translateY(-14px) rotate(10deg); }
    50% { transform: translateY(4px) rotate(-4deg); }
    75% { transform: translateY(-10px) rotate(6deg); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.5; transform: scale(0.85) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(0deg); }
  }

  .cake-scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  .candle-wrap {
    position: relative;
    width: 22px;
    height: 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .flame {
    width: 16px;
    height: 24px;
    background: radial-gradient(circle at 50% 70%, #fff6c9, #ffd23f 40%, #ff7b3f 80%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: absolute;
    top: -20px;
    animation: flicker 0.6s ease-in-out infinite alternate;
    transform-origin: bottom center;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  @keyframes flicker {
    0% { transform: scaleY(1) rotate(-2deg); }
    100% { transform: scaleY(1.12) rotate(3deg); }
  }

  .flame.out {
    opacity: 0;
    transform: scaleY(0.2) translateY(10px);
  }

  .smoke {
    position: absolute;
    top: -24px;
    width: 6px;
    height: 6px;
    background: rgba(150,150,150,0.5);
    border-radius: 50%;
    opacity: 0;
  }

  .smoke.rise {
    animation: smokeRise 1.4s ease-out forwards;
  }

  @keyframes smokeRise {
    0% { opacity: 0.6; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(2.4); }
  }

  .wick {
    width: 3px;
    height: 10px;
    background: #5a4632;
    position: absolute;
    top: -4px;
  }

  .candle-body {
    width: 22px;
    height: 80px;
    background: repeating-linear-gradient(45deg, var(--pink-deep), var(--pink-deep) 6px, var(--cream) 6px, var(--cream) 12px);
    border-radius: 4px;
    box-shadow: inset -3px 0 4px rgba(0,0,0,0.08);
  }

  .cake-body {
    width: 220px;
    margin-top: -4px;
    z-index: 1;
  }

  .cake-top {
    width: 220px;
    height: 30px;
    background: var(--cream);
    border-radius: 50% / 100%;
    position: relative;
    box-shadow: 0 4px 0 rgba(0,0,0,0.03);
  }

  .cake-tier {
    width: 220px;
    height: 70px;
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-deep) 100%);
    border-radius: 0 0 14px 14px;
    position: relative;
    box-shadow: 0 6px 14px rgba(155,127,199,0.35);
  }

  .drip {
    position: absolute;
    top: -6px;
    width: 100%;
    height: 20px;
    background:
      radial-gradient(circle at 10% 0, var(--cream) 6px, transparent 7px),
      radial-gradient(circle at 30% 0, var(--cream) 5px, transparent 6px),
      radial-gradient(circle at 55% 0, var(--cream) 7px, transparent 8px),
      radial-gradient(circle at 75% 0, var(--cream) 5px, transparent 6px),
      radial-gradient(circle at 92% 0, var(--cream) 6px, transparent 7px);
  }

  .blow-btn {
    margin-top: 34px;
    padding: 12px 40px;
    font-size: 1.05rem;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, var(--lavender-deep), var(--pink-deep));
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(155,127,199,0.5);
    letter-spacing: 1px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .blow-btn:active {
    transform: scale(0.94);
  }

  .blow-hint {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--text);
    opacity: 0.6;
  }

  /* ---------- PAGE 2: BALLOONS ---------- */

  #page-reveal {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.95);
    background: linear-gradient(160deg, var(--pink) 0%, var(--lavender) 100%);
  }

  #page-reveal.show {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

  .balloon {
    position: absolute;
    bottom: -160px;
    width: 60px;
    height: 76px;
    border-radius: 50% 50% 48% 48%;
    animation: floatUp 7s ease-in infinite;
    opacity: 0.92;
  }

  .balloon::after {
    content: '';
    position: absolute;
    bottom: -34px;
    left: 50%;
    width: 1px;
    height: 34px;
    background: rgba(90,70,110,0.4);
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(-4deg); opacity: 0.95; }
    50% { transform: translateY(-55vh) translateX(20px) rotate(4deg); }
    100% { transform: translateY(-115vh) translateX(-15px) rotate(-4deg); opacity: 0.85; }
  }

  .reveal-content {
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 24px;
  }

  .photo-frame {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 6px solid var(--cream);
    box-shadow: 0 10px 26px rgba(155,127,199,0.45);
    overflow: hidden;
    background: linear-gradient(135deg, var(--lavender), var(--pink));
    display: flex;
    align-items: center;
    justify-content: center;
    animation: popIn 0.8s cubic-bezier(.34,1.56,.64,1) 0.3s both;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-fallback {
    font-size: 2.4rem;
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .happy-title {
    margin-top: 20px;
    font-family: 'Brush Script MT', cursive;
    font-size: 2.6rem;
    color: var(--lavender-deep);
    text-shadow: 0 2px 10px rgba(255,255,255,0.7);
    animation: popIn 0.8s cubic-bezier(.34,1.56,.64,1) 0.6s both;
  }

  .happy-sub {
    font-size: 0.95rem;
    color: var(--text);
    margin-top: 4px;
    opacity: 0.85;
    animation: popIn 0.8s cubic-bezier(.34,1.56,.64,1) 0.8s both;
  }

  .cat {
    font-size: 2.6rem;
    margin-top: 18px;
    display: inline-block;
    animation: catDance 0.9s ease-in-out infinite;
  }

  @keyframes catDance {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-10px) rotate(6deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .flame, .cat, .balloon, .cake-tier { animation: none !important; }
  }
</style>
</head>
<body>

  <!-- PAGE 1: CANDLE -->
  <div class="page" id="page-candle">
    <div class="stars" id="stars"></div>

    <div class="title-cute">for my favorite person 💜</div>
    <div class="subtitle-cute">make a wish, plum...</div>

    <div class="cake-scene">
      <div class="candle-wrap">
        <div class="wick"></div>
        <div class="flame" id="flame"></div>
        <div class="smoke" id="smoke"></div>
        <div class="candle-body"></div>
      </div>
      <div class="cake-body">
        <div class="drip"></div>
        <div class="cake-top"></div>
        <div class="cake-tier"></div>
      </div>
    </div>

    <button class="blow-btn" id="blowBtn">blow 🎐</button>
    <div class="blow-hint">tap to blow out the candle</div>
  </div>

  <!-- PAGE 2: REVEAL -->
  <div class="page" id="page-reveal">
    <div id="balloons"></div>

    <div class="reveal-content">
      <div class="photo-frame">
        <img src="photo.jpg" alt="us" onerror="this.style.display='none'; this.parentElement.querySelector('.photo-fallback').style.display='flex';">
        <div class="photo-fallback" style="display:none;">💗</div>
      </div>

      <div class="happy-title">Happy Birthday Plum</div>
      <div class="happy-sub">every year with you is my favorite one yet</div>
      <div class="cat">🐱</div>
    </div>
  </div>

<script>
  // scatter dancing stars
  const starsContainer = document.getElementById('stars');
  const starPositions = [
    {top:'8%', left:'12%'}, {top:'14%', left:'80%'}, {top:'22%', left:'45%'},
    {top:'30%', left:'20%'}, {top:'28%', left:'70%'}, {top:'6%', left:'55%'},
    {top:'38%', left:'8%'}, {top:'40%', left:'88%'}
  ];
  starPositions.forEach((pos, i) => {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = '⭐';
    s.style.top = pos.top;
    s.style.left = pos.left;
    s.style.animationDelay = (i * 0.25) + 's';
    starsContainer.appendChild(s);
  });

  // balloons for reveal page
  const balloonColors = ['#ffb6d5', '#c9b3ea', '#ffd6e8', '#b39ddb', '#ffcfe3'];
  const balloonsContainer = document.getElementById('balloons');
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = (5 + i * 11) + '%';
    b.style.background = `radial-gradient(circle at 35% 30%, #fff, ${balloonColors[i % balloonColors.length]})`;
    b.style.animationDelay = (i * 0.6) + 's';
    b.style.animationDuration = (6 + (i % 3)) + 's';
    balloonsContainer.appendChild(b);
  }

  // blow out candle interaction
  const blowBtn = document.getElementById('blowBtn');
  const flame = document.getElementById('flame');
  const smoke = document.getElementById('smoke');
  const pageCandle = document.getElementById('page-candle');
  const pageReveal = document.getElementById('page-reveal');

  blowBtn.addEventListener('click', () => {
    if (flame.classList.contains('out')) return;
    flame.classList.add('out');
    smoke.classList.add('rise');
    blowBtn.disabled = true;

    setTimeout(() => {
      pageCandle.classList.add('hidden');
      pageReveal.classList.add('show');
    }, 1000);
  });
</script>

</body>
</html>
